<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 440">
  <!-- APPROXIMATE RECREATION of the Tune Karaoke logo you shared inline in chat.
       It came through as a pasted image, not a file attachment, so this is a
       stand-in equalizer/wordmark in the same black + gold style — swap this
       file for your real exported logo (PNG or SVG) for an exact match. -->
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f5e2a8"/>
      <stop offset="55%" stop-color="#d9ab4e"/>
      <stop offset="100%" stop-color="#a9772a"/>
    </linearGradient>
  </defs>

  <rect width="440" height="440" rx="24" fill="#0a0806"/>

  <!-- side dots -->
  <circle cx="26" cy="235" r="9" fill="url(#gold)"/>
  <circle cx="54" cy="235" r="7" fill="url(#gold)"/>
  <circle cx="79" cy="235" r="5.5" fill="url(#gold)"/>
  <circle cx="414" cy="235" r="9" fill="url(#gold)"/>
  <circle cx="386" cy="235" r="7" fill="url(#gold)"/>
  <circle cx="361" cy="235" r="5.5" fill="url(#gold)"/>

  <!-- top equalizer arch -->
  <rect x="103" y="150" width="16" height="65" rx="8" fill="url(#gold)"/>
  <circle cx="141" cy="185" r="9" fill="url(#gold)"/>
  <rect x="164" y="105" width="16" height="110" rx="8" fill="url(#gold)"/>
  <circle cx="202" cy="165" r="8" fill="url(#gold)"/>
  <rect x="224" y="60" width="16" height="155" rx="8" fill="url(#gold)"/>
  <circle cx="262" cy="165" r="8" fill="url(#gold)"/>
  <rect x="284" y="105" width="16" height="110" rx="8" fill="url(#gold)"/>
  <circle cx="322" cy="185" r="9" fill="url(#gold)"/>
  <rect x="345" y="150" width="16" height="65" rx="8" fill="url(#gold)"/>

  <!-- bottom equalizer arch (mirrored) -->
  <rect x="103" y="225" width="16" height="65" rx="8" fill="url(#gold)"/>
  <circle cx="141" cy="255" r="9" fill="url(#gold)"/>
  <rect x="164" y="225" width="16" height="110" rx="8" fill="url(#gold)"/>
  <circle cx="202" cy="315" r="8" fill="url(#gold)"/>
  <rect x="224" y="225" width="16" height="155" rx="8" fill="url(#gold)"/>
  <circle cx="262" cy="315" r="8" fill="url(#gold)"/>
  <rect x="284" y="225" width="16" height="110" rx="8" fill="url(#gold)"/>
  <circle cx="322" cy="255" r="9" fill="url(#gold)"/>
  <rect x="345" y="225" width="16" height="65" rx="8" fill="url(#gold)"/>

  <!-- wordmark -->
  <text x="220" y="248" font-family="Lato, Arial, sans-serif" font-weight="900" font-size="66"
        letter-spacing="2" fill="url(#gold)" text-anchor="middle">TUNE</text>
</svg>
